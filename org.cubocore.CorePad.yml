app-id: org.cubocore.CorePad
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: corepad
rename-desktop-file: cc.cubocore.CorePad.desktop
rename-icon: cc.cubocore.CorePad
rename-appdata-file: cc.cubocore.CorePad.metainfo.xml
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home # For accessing any text file from user directory
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/pkgconfig
  - /man
  - /share/man
  - /lib/*.la
  - /lib/*.a
modules:
  - name: libcprime
    buildsystem: cmake-ninja
    config-opts: [
        "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    ]
    sources:
      - type: git
        url: https://gitlab.com/cubocore/libcprime.git
        commit: 17d4c94f3be2c7f67dc757cf852f0144945c2c69
        tag: v5.0.1
  - name: corepad
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://gitlab.com/cubocore/coreapps/corepad.git
        commit: ed6d14ec0cf6308be9b089d646bccd4100d24f3f
        tag: v5.0.1
      - type: patch
        path: fix-icon-name.patch
